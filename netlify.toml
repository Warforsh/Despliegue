[build]
  # Lógica de build en línea (equivale a build.js) para no depender de un archivo de script
  command = '''echo "Archivos recibidos:" && ls -A . public 2>&1; mkdir -p public && node -e "const fs=require('fs'),e=process.env;const u=(e.SUPABASE_URL||e.SUPABASE_DATABASE_URL||'').replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'');if(!u||!e.SUPABASE_ANON_KEY)console.warn('AVISO: faltan SUPABASE_URL y/o SUPABASE_ANON_KEY');fs.writeFileSync('public/config.js','window.APP_CONFIG='+JSON.stringify({SUPABASE_URL:u,SUPABASE_ANON_KEY:e.SUPABASE_ANON_KEY||'',CONSULTATION_FEE:Number(e.CONSULTATION_FEE||150)})+';\n');console.log('public/config.js generado')"'''
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  # La URL y la clave anon de Supabase son públicas por diseño (van al navegador en config.js).
  # El escaneo de secretos sigue activo para todo lo demás, incluida SUPABASE_SERVICE_ROLE_KEY.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
